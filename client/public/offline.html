<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Concrete Concepts Group</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F2A44;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 96px;
      height: 96px;
      margin-bottom: 2rem;
      border-radius: 16px;
    }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
      color: #C9A44D;
    }
    p {
      font-size: 1.1rem;
      color: #94a3b8;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .phone {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #C9A44D;
      color: #0F2A44;
      padding: 0.875rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .phone:hover { opacity: 0.9; }
    .retry {
      background: transparent;
      border: 2px solid #C9A44D;
      color: #C9A44D;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }
    .retry:hover { background: rgba(201, 164, 77, 0.1); }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="CCG" class="icon">
  <h1>You're Offline</h1>
  <p>No worries — you can still reach us directly. We'll get back to you within 24 hours.</p>
  <a href="tel:0424463268" class="phone">Call 0424 463 268</a>
  <button class="retry" onclick="window.location.reload()">Try Again</button>
</body>
</html>
